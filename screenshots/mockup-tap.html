<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#09100c;color:rgba(255,255,255,.92);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;position:relative}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.b1{width:70vw;height:70vw;background:#34d399;opacity:.12;top:10vh;left:50%;transform:translateX(-50%)}
.b2{width:40vw;height:40vw;background:#2d6e47;opacity:.2;bottom:-5vh;right:-5vw}

.screen{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:0 clamp(18px,5vw,32px)}

.status{display:flex;justify-content:space-between;align-items:center;padding:clamp(12px,1.8vh,18px) 0 6px;font-size:clamp(13px,1.8vw,16px);font-weight:600}
.status-right{display:flex;gap:5px;align-items:center}

.top-bar{display:flex;align-items:center;gap:12px;padding:clamp(6px,1vh,12px) 0}
.back-btn{width:clamp(32px,5vw,40px);height:clamp(32px,5vw,40px);border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.habit-meta{flex:1}
.habit-name{font-family:'Playfair Display',Georgia,serif;font-size:clamp(20px,3.5vw,28px);font-weight:600}
.habit-cat{font-size:clamp(11px,1.4vw,14px);color:rgba(255,255,255,.4);margin-top:2px}
.type-badge{padding:4px 12px;border-radius:20px;font-size:clamp(11px,1.3vw,13px);font-weight:600;background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3);white-space:nowrap}

/* Tap circle */
.tap-area{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(8px,1.5vh,16px)}
.outer-ring{width:clamp(160px,35vw,220px);height:clamp(160px,35vw,220px);border-radius:50%;border:2px solid rgba(52,211,153,.2);display:flex;align-items:center;justify-content:center;position:relative}
.outer-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(52,211,153,.1)}
.inner-circle{width:86%;height:86%;border-radius:50%;background:linear-gradient(135deg,rgba(52,211,153,.15) 0%,rgba(45,110,71,.25) 100%);border:1px solid rgba(52,211,153,.3);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 60px rgba(52,211,153,.15)}
.tap-count{font-family:'DM Mono','SF Mono',monospace;font-size:clamp(44px,9vw,72px);font-weight:400;color:#34d399;line-height:1}
.tap-hint{font-size:clamp(12px,1.5vw,15px);color:rgba(255,255,255,.4);letter-spacing:.5px}

/* Stat cards */
.stats-row{display:flex;gap:clamp(8px,1.5vw,12px);margin-bottom:clamp(8px,1.4vh,14px)}
.sc{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:clamp(12px,1.8vw,16px);padding:clamp(10px,1.6vh,16px) clamp(10px,1.8vw,14px);backdrop-filter:blur(12px);text-align:center}
.sc-val{font-family:'DM Mono','SF Mono',monospace;font-size:clamp(18px,3vw,26px);font-weight:500;color:rgba(255,255,255,.9);line-height:1}
.sc-lbl{font-size:clamp(10px,1.2vw,12px);color:rgba(255,255,255,.4);margin-top:4px}

/* Action row */
.actions{display:flex;gap:clamp(8px,1.5vw,12px);margin-bottom:clamp(12px,2vh,20px)}
.action-btn{flex:1;padding:clamp(10px,1.6vh,14px);border-radius:clamp(10px,1.6vw,14px);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-size:clamp(12px,1.5vw,14px);font-weight:500;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.action-btn.primary{background:linear-gradient(135deg,#2d6e47,#34d399);border-color:transparent;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="screen">

  <div class="status">
    <span>9:41</span>
    <div class="status-right">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="white" opacity=".5"/><rect x="4.5" y="5" width="3" height="7" rx="1" fill="white" opacity=".7"/><rect x="9" y="2" width="3" height="10" rx="1" fill="white" opacity=".9"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="white"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="white"/><path d="M3.5 7C5 5.3 6.4 4.5 8 4.5s3 .8 4.5 2.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M1 4.5C3.2 2 5.5 1 8 1s4.8 1 7 3.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".5"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y="1" width="22" height="11" rx="3" stroke="white" stroke-width="1" fill="none" opacity=".5"/><rect x="23" y="4" width="2.5" height="5" rx="1" fill="white" opacity=".5"/><rect x="2" y="2.5" width="17" height="8" rx="1.5" fill="white"/></svg>
    </div>
  </div>

  <div class="top-bar">
    <div class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="habit-meta">
      <div class="habit-name">Morning Run</div>
      <div class="habit-cat">Fitness</div>
    </div>
    <div class="type-badge">Start</div>
  </div>

  <div class="tap-area">
    <div class="outer-ring">
      <div class="inner-circle">
        <div class="tap-count">1</div>
        <div class="tap-hint">tap to log</div>
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="sc">
      <div class="sc-val">1</div>
      <div class="sc-lbl">Today</div>
    </div>
    <div class="sc">
      <div class="sc-val" style="color:#34d399">12d 🔥</div>
      <div class="sc-lbl">Streak</div>
    </div>
    <div class="sc">
      <div class="sc-val">47</div>
      <div class="sc-lbl">All Time</div>
    </div>
  </div>

  <div class="actions">
    <div class="action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg>
      Undo
    </div>
    <div class="action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      Repeat
    </div>
    <div class="action-btn primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Details
    </div>
  </div>

</div>
</body>
</html>
